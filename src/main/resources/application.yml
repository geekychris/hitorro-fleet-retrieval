# hitorro-fleet-retrieval — default configuration.
# Override at runtime via env vars or --hitorro.fleet.retrieval.<name>=...
server:
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: hitorro-fleet-retrieval
  # Spring MVC writes JSON with Boot's Jackson 3 JsonMapper. Keep the format the app had on
  # Jackson 2 (Boot's Jackson 2 mapper, with spring.jackson2.default-property-inclusion: non_null):
  # Jackson 2 defaults + Boot's (ISO dates, unknown properties ignored), NON_NULL, and
  # Jackson 2.18's stream limits. See Jackson2CompatConfig.
  jackson:
    use-jackson2-defaults: true
    default-property-inclusion: non_null
    factory:
      constraints:
        read:
          max-nesting-depth: 1000
          max-string-length: 20000000
        write:
          max-nesting-depth: 1000

hitorro:
  fleet:
    retrieval:
      # standalone: service owns its own Lucene + KV, ingests via REST.
      # shared:     reads pipeline-produced indexes from ${pipelinesHome}/lucene
      #             and KV from ${pipelinesHome}/kv (mesh writes, retrieval reads).
      mode: standalone
      default-language: en
      # Only used when mode=shared. Default matches the mesh pipelines' layout.
      # pipelines-home: ${HITORRO_PIPELINES_HOME:${user.home}/.hitorro/pipelines}
      # Only used when mode=standalone.
      # standalone-lucene-home: ${user.home}/.hitorro/fleet-retrieval/lucene
      # standalone-kv-home:     ${user.home}/.hitorro/fleet-retrieval/kv
      kv-enabled: true
      allow-ingest: true

logging:
  level:
    com.hitorro.fleet: INFO
    com.hitorro.retrieval: INFO
    com.hitorro.index: INFO

management:
  endpoints:
    # Actuator JSON comes from Jackson2CompatConfig.endpointJsonMapper (Jackson 2's format).
    jackson:
      isolated-json-mapper: false
    web:
      exposure:
        include: health, info, prometheus, metrics
